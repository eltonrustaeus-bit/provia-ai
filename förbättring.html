<!doctype html>
<html lang="sv">
<head>
  <script src="/js/exgen-runtime.js"></script>
  <script src="/js/site-gate.js"></script>
  <script src="/js/account-storage.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="js/exgen-modules.js"></script>
  <script>if(window.ExGenRuntime.environment === "production" && location.hostname.includes("vercel.app")){location.replace(window.ExGenRuntime.appOrigin+location.pathname+location.search)}</script>
  <title>ExGen – Min utveckling</title>
  <!-- Kräver konto. En sökträff hit landar på en inloggningsruta, inte på innehåll. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="/image/favicon-192.png" />
  <link rel="icon" href="/image/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="exgen-tokens.css" />
  <link rel="stylesheet" href="exgen-shell.css" />
  <!-- ExGens delade formspråk: rösten, kortet, knapparna, måttet. Samma fil som
       provskaparen bygger av, så sidorna inte glider isär. -->
  <link rel="stylesheet" href="exgen-ui.css" />

  <style>
    /* ── TOKENS — matches style.css's single ExGen palette (Phase 10b) ── */
    /* This page carries its own :root, declared after style.css and therefore
       winning over it. Left untouched it would have been the one page that
       kept the pre-rework palette — pure-white page and teal-tinted borders
       — while every other page moved to the tinted page / neutral hairline
       system. Values below are kept in sync with style.css deliberately;
       --a-border/--a-border2/--glass are local-only and have no shared
       equivalent, so they stay. */
    :root{
      --a:#00768F; --a2:#00647A; --a-dim:rgba(0,118,143,.08); --a-border:#E4E7EC; --a-border2:#D4D9E0;
      --bg:#F7F9FB; --s:#ffffff; --s2:#f8fafc; --s3:#f1f4f8; --glass:rgba(255,255,255,.88);
      --t:#1B2430; --t2:#5B6472; --t3:#667085;
      --l:#EEF1F4; --l2:#E4E7EC;
      --ok:#166534; --warn:#92620A; --danger:#B91C1C;
      --sh:0 1px 2px rgba(14,27,42,.04); --sh2:0 4px 16px rgba(14,27,42,.06); --sh3:0 12px 32px rgba(14,27,42,.09);
      --r:8px; --r2:4px; --max:1060px;
      --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono','SF Mono',monospace;
    }

    /* ── RESET ── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--font);background:var(--bg);color:var(--t);
      line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
      transition:background .28s ease,color .28s ease;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 70vw 50vh at 8% 0%, rgba(0,183,217,.055),transparent 65%),
        radial-gradient(ellipse 55vw 35vh at 92% 15%, rgba(0,183,217,.035),transparent 65%);
      transition:opacity .28s ease;
    }
    a{text-decoration:none;color:inherit}

    /* ── HEADER OVERRIDE ── */
    header{ z-index:3000; }

    /* ── DANGER BUTTON (not in style.css) ── */
    .btnD{background:transparent;color:var(--danger);border-color:rgba(212,64,22,.2)}
    .btnD:hover{background:rgba(212,64,22,.07);border-color:rgba(212,64,22,.38)}

    /* ── MAIN ── */
    main.wrap{padding-top:40px;padding-bottom:80px}

    /* ── ZONER ────────────────────────────────────────────────────────────
       Sidlokal layoutlim, inte vokabulär. exgen-ui.css:s arton selektorer är
       avsiktligt korta och ska förbli det; det här är avståndet mellan zonerna
       och hur en select ställer sig under sin etikett. Inga nya färger, inga
       nya tokens — allt hämtas ur exgen-tokens.css. */
    /* Tillbakaknappen. Låg och tyst, alltid först på skärmen — det är den
       enda vägen ut ur en skärm som inte är ingången. */
    .xf-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:var(--exgen-space-4);
      background:none;border:0;padding:0;cursor:pointer;
      font-family:var(--exgen-font-mono);font-size:11px;letter-spacing:var(--exgen-tracking-wide);
      text-transform:uppercase;color:var(--xf-ink-2);transition:color .18s}
    .xf-back:hover{color:var(--xf-accent)}
    .xf-back:focus-visible{outline:var(--exgen-focus-ring);outline-offset:2px}
    .xfFilters{align-items:flex-end;margin:var(--exgen-space-6) 0 var(--exgen-space-4)}
    .xfField{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 140px}
    .xfField > .xf-eyebrow{margin-bottom:0}
    /* .xf-input är dimensionerad för materialrutan i provskaparen — 18px text
       och 15px luft. En kursväljare bredvid en knapp är en kontroll, inte en
       skrivyta, så den får kontrollens mått. */
    .xfField > .xf-input{font-size:var(--exgen-text-sm);padding:9px 12px}
    .xfSync{flex:none}
    /* Åtgärdsraden får sidans bakgrund under sig, annars syns listan igenom
       när den fastnar överst. */
    /* ── ÅTGÄRDSRADEN ──────────────────────────────────────────────────────
       Raden bar tre kontroller i tre nyanser av grått, och primärhandlingen var
       den minst framträdande av dem — den saknade .primary och ärvde därför
       webbläsarens egen knappgrå. Den var dessutom vit på vit, så när den
       fastnade överst lästes den som ett glapp i listan i stället för som ett
       verktygsfält.

       Nu en egen yta med en hårfin kant, en mätare överst och en tydlig
       ordning: vad som är valt till vänster, vad man kan göra till höger. */
    .xfTrainBar{
      background:var(--s);
      border:1px solid var(--l);
      border-radius:var(--exgen-radius-lg);
      margin-bottom:var(--exgen-space-4);
      overflow:hidden;
      transition:box-shadow .2s ease,border-color .2s ease;
    }
    /* Skuggan kommer först när raden faktiskt klistrat fast. Utan den ser den
       ut att sväva redan i vila. */
    .xfTrainBar:has(#trainSelectedBtn:not(:disabled)){border-color:var(--l2)}

    /* Mätaren: hur mycket av det man ser man har valt. Två pixlar, ingen text,
       och den enda ytan på sidan som använder märkesgradienten — raden är
       sidans enda handling, och får låta som det. */
    .xfTrainMeter{height:2px;background:var(--l);overflow:hidden}
    .xfTrainMeter > i{
      display:block;height:100%;width:0;
      background:var(--exgen-gradient,var(--a));
      transition:width .28s cubic-bezier(.22,.61,.36,1);
    }

    .xfTrainRow{
      display:flex;align-items:center;gap:var(--exgen-space-3);
      padding:var(--exgen-space-3) var(--exgen-space-4);
    }
    .xfTrainCount{
      flex:1;min-width:0;margin:0;
      font-family:var(--exgen-font-mono);font-size:11.5px;
      letter-spacing:var(--exgen-tracking-wide);text-transform:uppercase;
      color:var(--xf-ink-2);
    }
    .xfTrainActs{display:flex;align-items:center;gap:var(--exgen-space-2);flex-shrink:0}
    /* Kompaktare än den delade knappen: raden är ett verktygsfält, inte en
       avslutning på en sida. */
    .xfTrainGo{padding:10px 20px;font-size:var(--exgen-text-sm)}
    .xfTrainClear{padding:10px 8px;font-size:var(--exgen-text-sm)}
    .xfTrainClear[hidden]{display:none}

    /* På telefon staplas raden med flit i stället för att radbryta av sig
       själv. Förut hamnade primärhandlingen ensam längst ned till vänster,
       vilket såg ut som ett fel snarare än ett val. */
    @media(max-width:520px){
      .xfTrainRow{flex-direction:column;align-items:stretch;gap:var(--exgen-space-2)}
      .xfTrainCount{text-align:center}
      .xfTrainActs{width:100%;gap:var(--exgen-space-2)}
      .xfTrainGo{flex:1;text-align:center}
    }
    /* ── FELBANKENS KORT ───────────────────────────────────────────────────
       Listan lästes som rörig, och orsaken var strukturell: frågan låg i en ram
       medan taggarna och åtgärderna låg UTANFÖR den, direkt på sidbakgrunden.
       Varje misstag var tre visuellt frånkopplade delar staplade på varandra.

       Nu ett kort. Allt som hör till misstaget ligger inuti det, och kortet är
       den enhet eleven markerar. */
    .xfMiss{
      background:var(--s);
      border:1px solid var(--l);
      border-radius:var(--exgen-radius-lg);
      margin-bottom:var(--exgen-space-3);
      overflow:hidden;
      transition:border-color .16s ease,box-shadow .16s ease;
    }
    .xfMiss:hover{border-color:var(--l2)}
    /* Markerat kort: accentkant på insidan, så kortet inte hoppar en pixel. */
    .xfMiss.sel{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}

    /* Frågeraden fyller kortets övre del. .xf-opt bär sin egen ram och yta i
       det delade lagret — här är kortet ramen, så den neutraliseras. */
    .xfMiss .xfMissRow{
      display:block;width:100%;text-align:left;
      background:none;border:0;border-radius:0;
      padding:var(--exgen-space-3) var(--exgen-space-4);
      cursor:pointer;
    }
    .xfMiss .xfMissRow::before{content:none}
    .xfMiss .xfMissRow:hover{background:var(--s2)}

    /* Huvudet: begreppet till vänster, poängen till höger. Två saker, inte
       fem — det var mängden likvärdiga piller som gjorde listan rörig. */
    .xfMissHead{display:flex;align-items:center;gap:var(--exgen-space-2);margin-bottom:6px}
    .xfMissConcept{
      font-family:var(--exgen-font-mono);font-size:10.5px;
      letter-spacing:var(--exgen-tracking-wide);text-transform:uppercase;
      color:var(--a2);
    }
    .xfMissConcept--none{color:var(--t3)}
    /* Den enda signalen som säger vad eleven ska prioritera. */
    .xfMissRepeat{
      font-family:var(--exgen-font-mono);font-size:10px;
      color:var(--warn);border:1px solid rgba(146,98,10,.28);
      border-radius:var(--exgen-radius-pill);padding:1px 8px;white-space:nowrap;
    }
    .xfMissScore{
      margin-left:auto;flex-shrink:0;
      font-family:var(--exgen-font-mono);font-size:12px;font-weight:500;
      color:var(--danger);
    }
    .xfMissQ{display:block;font-size:15px;line-height:1.45;color:var(--t);font-weight:500}
    .xfMissMeta{display:block;margin-top:5px;font-family:var(--exgen-font-mono);font-size:10.5px;color:var(--t3)}

    /* Åtgärderna var 11px versal monospace utan ram, utanför kortet — de
       lästes som bildtext och var 12px höga. Nu en egen rad i kortets fot,
       avdelad med en hårfin linje, med träffbar yta. */
    .xfMissMore{
      display:flex;border-top:1px solid var(--l);
    }
    .xfMissMore > button{
      flex:1;min-height:40px;padding:0 6px;
      background:none;border:0;border-right:1px solid var(--l);
      cursor:pointer;
      font-family:var(--exgen-font);font-size:12.5px;font-weight:500;
      color:var(--t2);
      transition:background .14s ease,color .14s ease;
    }
    .xfMissMore > button:last-child{border-right:0}
    .xfMissMore > button:hover{background:var(--s2);color:var(--a2)}
    .xfMissMore > button:focus-visible{outline:var(--exgen-focus-ring);outline-offset:-2px}

    .xfMissDetail{margin:0;padding:var(--exgen-space-3) var(--exgen-space-4);
      border-top:1px solid var(--l);background:var(--s2)}
    /* Felkoderna bor här, hos feedbacken de förklarar. */
    .xfMissCodes{margin:-4px 0 10px}
    .xfMissCodes .xf-chip{font-size:11px;padding:3px 9px}
    .tipsBoxEl{margin:0 var(--exgen-space-4) var(--exgen-space-3)}
    .xfDisclose{background:none;border:0;padding:0;cursor:pointer;font-family:var(--exgen-font-mono);
      font-size:10.5px;letter-spacing:var(--exgen-tracking-wide);text-transform:uppercase;
      color:var(--xf-ink-2);transition:color .18s}
    .xfDisclose:hover{color:var(--xf-accent)}
    .xfCached{opacity:.6;text-transform:none;letter-spacing:0}
    .xfMissDetail{margin-top:10px}
    .xfCoachAct{margin-top:var(--exgen-space-4)}
    .xfCoachAct:empty,.xfCoachAct:has(> [style*="display:none"]){margin-top:0}
    .xfStats{padding-top:var(--exgen-space-4);padding-bottom:var(--exgen-space-4)}
    .xfReportAct{margin:var(--exgen-space-4) 0}
    .xfReportWrap{position:relative}
    /* Zonen P.E.R just skickade eleven till. Säger "här" en gång och bleknar —
       samma mönster och samma accent som .planCard--flash på prissidan. */
    @media(max-width:520px){.xfFilters{align-items:stretch}.xfSync{width:100%}}
    @media(max-width:600px){main.wrap{padding-bottom:48px}}

    /* P.E.R:s röst kommer från exgen-ui.css (.xf-per/.xf-orb/.xf-say/.xf-sub).
       Sidan hade en egen kopia här tills det delade lagret bröts ut. */
    .coachText{font-size:13px;color:var(--t2);line-height:1.72;white-space:pre-wrap}

    /* ── CHART ── */
    .chartWrap{margin-top:14px;border:1px solid var(--l);border-radius:var(--exgen-radius-sm);background:var(--s2);padding:18px 18px 14px;transition:background .28s ease,border-color .28s ease}
    .chartFallbackList{margin:10px 0 0;padding-left:22px;display:grid;gap:5px;color:var(--t2);font-size:var(--exgen-text-sm)}
    .chartLabel{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
    .chartSummary{margin:-4px 0 10px;color:var(--t2);font-size:var(--exgen-text-sm);line-height:1.5}
    .chartData{margin-top:8px;color:var(--t2);font-size:var(--exgen-text-sm)}
    .chartData summary{width:fit-content;color:var(--a2);cursor:pointer;padding:5px 0}
    .chartData summary:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
    .chartData table{width:100%;border-collapse:collapse;margin-top:8px;font-size:var(--exgen-text-sm)}
    .chartData caption{text-align:left;color:var(--t3);padding-bottom:5px}
    .chartData th,.chartData td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--l);font-weight:400}
    .chartData th{color:var(--t3);font-weight:600}
    .chartData th:last-child,.chartData td:last-child{text-align:right;font-variant-numeric:tabular-nums}
    @media(max-width:600px){.chartData[open]{padding-bottom:72px}}

    /* ── MISTAKE GRID ── */
    /* En kolumn. Måttet är 580px, så minmax(300px,1fr) gav ändå aldrig två —
       rutnätet var en förklädd lista. */
    .mistakeGrid{display:block}

    /* ── CONCEPT BREAKDOWN (level 2 under course) ── */
    .conceptBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .conceptBarLabel{
      font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.05em;
      text-transform:uppercase;margin-right:2px;
    }
    .conceptChip{
      display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
      border-radius:var(--exgen-radius-pill);border:1px solid var(--l);background:var(--s);
      cursor:pointer;font-family:var(--font);font-weight:500;font-size:11.5px;color:var(--t2);
      transition:all .13s ease;
    }
    .conceptChip:hover{border-color:var(--l2);color:var(--t)}
    .conceptChip.active{background:var(--a-dim);border-color:var(--a-border2);color:var(--a2)}
    .conceptChipN{font-family:var(--mono);font-size:10px;color:var(--t3)}
    .conceptChip.active .conceptChipN{color:var(--a2)}
    .mFL{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
    .mFV{font-size:12px;color:var(--t2);line-height:1.6;white-space:pre-wrap;margin-bottom:9px}

    .tinyBtn{
      display:inline-flex;align-items:center;gap:5px;padding:5px 9px;
      border-radius:var(--exgen-radius-md);border:1px solid var(--l);background:var(--s);
      cursor:pointer;font-family:var(--font);font-weight:500;font-size:12px;color:var(--t2);
      transition:all .13s ease;
    }
    .tinyBtn:hover{border-color:var(--l2);color:var(--t);box-shadow:var(--sh)}
    .tinyBtnP{background:var(--a-dim);border-color:var(--a-border);color:var(--a2)}
    .tinyBtnP:hover{background:rgba(0,183,217,.16);border-color:var(--a-border2);color:var(--t)}

    .tipsBox{
      margin-top:9px;padding:13px;border:1px solid var(--a-border);border-left:2px solid var(--a);
      border-radius:0 var(--exgen-radius-sm) var(--exgen-radius-sm) 0;background:var(--a-dim);
      font-size:12px;color:var(--t2);line-height:1.65;white-space:pre-wrap;
      animation:fadeUp .18s ease;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .reportBox{
      position:relative;background:var(--s2);border:1px solid var(--l);border-radius:var(--exgen-radius-sm);
      padding:18px;min-height:130px;
      font-size:13px;color:var(--t2);line-height:1.72;white-space:pre-wrap;
      transition:background .28s ease;
    }
    .loadOv{
      position:absolute;inset:0;border-radius:var(--exgen-radius-sm);
      background:var(--glass);backdrop-filter:blur(5px);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:10;
    }
    .loadOv.on{opacity:1;pointer-events:auto}
    .spinner{width:22px;height:22px;border:2px solid var(--l2);border-top-color:var(--a);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loadSteps{display:flex;flex-direction:column;gap:4px;align-items:center}
    .loadStep{font-family:var(--mono);font-size:11px;color:var(--t3);opacity:0;transform:translateY(3px);transition:all .22s ease}
    .loadStep.on{opacity:1;transform:none;color:var(--t2)}

    /* ── STATUS ── */
    .statusText{font-family:var(--mono);font-size:11px;color:var(--t3);margin-bottom:10px}
    .statusText.ok{color:var(--ok)} .statusText.warn{color:var(--warn)} .statusText.bad{color:var(--danger)}

    /* ── EMPTY STATE ── */
    .emptyState{display:flex;flex-direction:column;align-items:center;padding:44px 24px;gap:9px;text-align:center;animation:fadeUp .25s ease}
    .emptyIcon{font-size:34px;opacity:.8;margin-bottom:2px}
    .emptyTitle{font-size:14px;font-weight:600;color:var(--t);letter-spacing:-.01em}
    .emptyDesc{font-size:12.5px;color:var(--t3);max-width:280px;line-height:1.6}

    /* ── FOOTER ── */
    footer{border-top:1px solid var(--l);padding:22px clamp(16px,4vw,36px);text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--t3);letter-spacing:.03em;transition:border-color .28s ease,color .28s ease}

    /* ── RESPONSIVE ── */
    @media(max-width:620px){
      .mistakeGrid,.dataGrid{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  
/* ── Nästa steg ──
   Ligger överst i Min utveckling, före de fyra vägarna. Det är den enda plats i
   produkten där elevens kunskapsprofil möter eleven själv, så den ska läsas
   först och kännas som ett råd — inte som ett betyg. */
.xfNextFocus{
  border:1px solid var(--exgen-border,#E4E7EC);
  border-radius:var(--exgen-radius,12px);
  padding:16px 18px;
  margin:0 0 18px;
  background:var(--exgen-bg-secondary,#F8FAFC);
}
.xfNextFocusTitle{
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  margin:6px 0 0;color:var(--exgen-text,#1B2430);
}
.xfNextFocusWhy{
  font-size:14px;line-height:1.5;margin-top:5px;
  color:var(--exgen-text-secondary,#667085);
}
.xfNextFocusChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.xfChip{
  font-size:12.5px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--exgen-border,#E4E7EC);
  background:var(--exgen-bg,#fff);color:var(--exgen-text-secondary,#667085);
}
/* Nivåerna färgas svagt. Kraftigare färg hade gjort listan till ett betygsblad,
   och orden bär redan informationen. */
.xfChip--behöver-träning{border-color:rgba(244,183,64,.5);color:var(--exgen-warning-text,#92620A)}
.xfChip--sitter{border-color:rgba(52,199,89,.45);color:var(--exgen-success-text,#166534)}
@media (max-width:520px){
  .xfNextFocus{padding:14px}
  .xfNextFocusTitle{font-size:16px}
}
</style>
  <!-- Sidlokal post i menyarket. "Rensa all data" är en handling på den
       här sidan, inte en destination, så den hamnar under avdelaren. -->
  <script>window.XG_MENU_EXTRA = [
    { label: "Rensa all data", id: "resetBtn", pill: "!" }
  ];</script>
  <script src="js/exgen-shell.js" defer></script>
  <!-- INTE defer. Modulen definierar bara window.XfScreens och rör ingen
       DOM vid laddning, medan sidans egna skript ligger sist i <body> och
       körs UNDER parsningen — alltså före varje defer-skript. Med defer
       blev det ReferenceError: XfScreens is not defined, och sidan byggde
       noll skärmar utan att något annat gick sönder. -->
  <script src="js/xf-screens.js"></script>
  <script src="shared.js" defer></script>
  <!-- Mobilmenyns bindning. Låg tidigare inline i fem kopior. -->
  
</head>

<body>
<a href="#main-content" class="skip-link">Hoppa till innehåll</a>

<!-- Den inbyggda inloggningsrutan är borttagen: shared.js-dialogen är
     enda inloggnings-UI:t nu, och den enda med lösenordsåterställning. -->

  <!-- HEADER -->
  <div data-xg-header></div>

  <!-- MAIN -->
  <main class="wrap" id="main-content">
    <!-- Skärmarna byggs av skärmväxlaren. Sidan var fyra zoner uppe
         samtidigt, i en ordning som motsade sina egna kommentarer. -->
    <div id="xf"></div>
  </main>

  <footer class="xg-footer" id="footerText">ExGen är studiestöd och ger ingen officiell betygssättning.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    /* ── STORAGE KEYS ── */
    const LS_HISTORY='proviaai_history',LS_MISTAKES='proviaai_mistakes',LS_LAST='proviaai_last_result',
      LS_MATERIAL='proviaai_last_material',LS_CLEAR_TS='proviaai_cleared_ts',
      LS_TRAIN_PICK='proviaai_train_pick',
      LS_USER_NAME_A='proviaai_user_name',LS_USER_NAME_B='proviaai_name',
      LS_SMART_TIPS_CACHE='proviaai_smart_tips_cache',LS_TEACHER_REPORT_CACHE='proviaai_teacher_report_cache',
      LS_PER_COACH_CACHE='proviaai_per_coach_cache';

    /* ── SUPABASE ── */
    const SB_URL=window.ExGenRuntime.supabaseUrl.trim();
    const SB_KEY=window.ExGenRuntime.publishableKey.trim();
    const SBG=typeof window!=='undefined'?window.supabase:null;
    const db=(SB_URL.startsWith('http')&&SB_KEY.length>40&&SBG?.createClient)?SBG.createClient(SB_URL,SB_KEY,{auth:{storageKey:window.ExGenRuntime.authStorageKey}}):null;

    async function getUserId(){if(!db)return null;const{data,error}=await db.auth.getUser();if(error)return null;return data?.user?.id||null;}
    async function fetchUserExams(){
      if(!db)return{ok:false,error:'Supabase not configured'};
      const uid=await getUserId();if(!uid)return{ok:false,error:'Not logged in'};
      const{data,error}=await db.from('user_exams').select('id,created_at,course,level,qtype,material,exam,answers,result').eq('user_id',uid).order('created_at',{ascending:true}).limit(500);
      if(error)return{ok:false,error:error.message||String(error)};
      return{ok:true,rows:data||[]};
    }
    async function deleteAllUserExamsFromAccount(session){
      if(!db) return{ok:false,error:'Supabase not configured'};
      const uid=session?.user?.id||'';
      if(!uid) return{ok:false,error:'Not logged in'};
      try{
        const token=session?.access_token||'';
        if(!token)return{ok:false,error:'Not logged in'};
        const r=await fetch('/api/check-role',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify({action:'delete_exams'})
        });
        const data=await r.json();
        if(!r.ok||data?.ok!==true) return{ok:false,error:data?.error||'delete failed'};
        return{ok:true};
      }catch(e){
        return{ok:false,error:String(e)};
      }
    }

    /* ── UTILS ── */
    function sjp(s,fb){try{return JSON.parse(s);}catch{return fb;}}
    function lsArr(k){const v=localStorage.getItem(k),a=sjp(v,[]);return Array.isArray(a)?a:[];}
    function lsObj(k){const v=localStorage.getItem(k),o=sjp(v,null);return(o&&typeof o==='object')?o:null;}
    function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
    function lsNum(k,fb=0){const n=Number(localStorage.getItem(k)||fb);return Number.isFinite(n)?n:fb;}
    function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
    const $=id=>document.getElementById(id);

    /* ── LOGIN OVERLAY ── */
    function showLoginOverlay(){
      // shared.js is deferred, so wait briefly for it. If it never arrives the
      // whole shared layer is missing, so send the visitor to the landing page
      // rather than leaving them on a gated page with nothing to click.
      if (window.openProviaLogin) { window.openProviaLogin('register'); return; }
      let n=0; const iv=setInterval(()=>{
        if (window.openProviaLogin) { clearInterval(iv); window.openProviaLogin('register'); }
        else if (++n>50) { clearInterval(iv); location.href='index.html'; }
      }, 60);
    }
    function hideLoginOverlay(){
      document.documentElement.style.overflow='';
      document.body.style.overflow='';
      if (window.closeProviaLogin) window.closeProviaLogin();
    }
    // initLoginOverlay() drev det borttagna inline-formuläret. shared.js
    // äger inloggning och registrering nu, inklusive återställning.

    /* ── ACCESS GATE ── */
    function disablePage(){
      const m=document.querySelector('main.wrap');
      if(m){m.style.pointerEvents='none';m.setAttribute('aria-disabled','true');}
      $('syncBtn')?.setAttribute('disabled','disabled');
      // resetBtn låses ALDRIG – användaren ska alltid kunna rensa sin data
    }
    function enablePage(){
      const m=document.querySelector('main.wrap');
      if(m){m.style.pointerEvents='';m.removeAttribute('aria-disabled');}
      $('resetBtn')?.removeAttribute('disabled');
      $('syncBtn')?.removeAttribute('disabled');
    }
    async function mustHaveAccess(){
      if(!db)return{ok:false,reason:'no_db'};
      const{data:sd,error:se}=await db.auth.getSession();
      if(se)return{ok:false,reason:'not_logged_in'};
      const uid=sd?.session?.user?.id||'';
      const token=sd?.session?.access_token||'';
      if(!uid||!token)return{ok:false,reason:'not_logged_in'};
      try{
        const r=await fetch('/api/check-role',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({user_id:uid})});
        const txt=await r.text();let j=null;try{j=JSON.parse(txt);}catch{}
        if(!r.ok)return{ok:false,reason:'api_error',detail:(j?.error)?String(j.error):'non-200'};
        const role=String(j?.role||'');
        return(role==='premium'||role==='user'||role==='admin')?{ok:true,role}:{ok:false,reason:'no_access',role};
      }catch(e){return{ok:false,reason:'api_error',detail:String(e)};}
    }
    /* Åtkomstfel skrivs i P.E.R:s röst på ingången i stället för i en egen
       statusrad. Raden visade dessutom eleven sin egen roll ("Åtkomst OK
       (premium)") — en felsökningsutskrift. Att allt gick bra behöver ingen
       text; då säger ingången redan vad som gäller. */
    function sayGate(text){
      flow.say('hem','Kommer inte åt din utveckling.',text);
    }
    async function gatePage(){
      const a=await mustHaveAccess();
      if(a.ok){enablePage();hideLoginOverlay();return true;}
      disablePage();
      if(a.reason==='not_logged_in'){
        showLoginOverlay();
        sayGate('Logga in för att fortsätta.');
      }
      else if(a.reason==='no_access')sayGate('Din plan ger inte åtkomst än — uppgradera till Premium.');
      else if(a.reason==='no_db')sayGate('Ingen kontakt med databasen just nu.');
      else sayGate(`Något gick fel: ${a.detail||'okänt fel'}.`);
      return false;
    }

    /* ── COACH LOGIC ── */
    function avgPct(arr){const a=(arr||[]).map(x=>chartPercent(x?.percent)).filter(n=>n!==null);if(!a.length)return null;return Math.round(a.reduce((s,n)=>s+n,0)/a.length);}
    function scoredHistory(h){return(h||[]).filter(x=>chartPercent(x?.percent)!==null);}
    function computeTrend(h){const scores=scoredHistory(h);if(scores.length<2)return null;const recent=scores.slice(-3),previous=scores.slice(-6,-3);if(previous.length)return{delta:avgPct(recent)-avgPct(previous)};const values=scores.map(x=>chartPercent(x.percent));return{delta:values[values.length-1]-values[0]};}
    function mostMistakeCourse(m){const map=new Map();(m||[]).forEach(x=>{const c=String(x.course||'').trim();if(c)map.set(c,(map.get(c)||0)+1);});let best={course:'',n:0};for(const[c,n]of map.entries())if(n>best.n)best={course:c,n};return best;}

    /* Etiketter för grade.js:s error_tags. Bodde i i18n-tabellen tills den
       revs — sidan är svensk. */
    const ERR_LABELS={
      definition_missing:'Definition saknas', concept_confusion:'Begreppsförväxling',
      calculation_error:'Räknefel',           units_missing:'Enhet saknas',
      method_missing:'Metod saknas',          reasoning_gap:'Resonemangsglapp',
      missing_steps:'Steg saknas',            structure_weak:'Svag struktur',
      example_missing:'Exempel saknas',       language_unclear:'Otydligt språk',
      off_topic:'Utanför ämnet',              insufficient_material:'För tunt material',
      mc_wrong:'Fel alternativ',              answer_key_unverified:'Facit ej verifierat',
    };

    /* ── CONCEPT TAGS (level 2 under course) ──
       grade.js tags every mistake with concept_tag + error_tags. The sentinels
       'Okänt'/'Unknown' mean the grader could not determine one — treat those
       as untagged rather than showing them as if they were real concepts. */
    const CONCEPT_UNKNOWN=new Set(['okänt','okant','unknown','']);
    function conceptOf(m){
      const c=String(m?.concept_tag||'').trim();
      return CONCEPT_UNKNOWN.has(c.toLowerCase())?'':c;
    }
    function errorTagsOf(m){
      return Array.isArray(m?.error_tags)?m.error_tags.map(x=>String(x||'').trim()).filter(Boolean):[];
    }
    function errLabel(tag){
      const map=ERR_LABELS;
      return map[tag]||String(tag).replaceAll('_',' ');
    }
    /* Counts concepts within an already course-filtered list, most frequent first. */
    function conceptCounts(list){
      const map=new Map();
      (list||[]).forEach(m=>{const c=conceptOf(m);if(c)map.set(c,(map.get(c)||0)+1);});
      return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    }
    /* Second-level filter inside the selected course. Deliberately not persisted:
       it is a drill-down on the current view, and a stale concept from a course
       the student has since left would silently hide their whole mistake list. */
    let CONCEPT_FILTER='';

    /* ── USER NAME ── */
    let USER_NAME='';
    function normName(s){const v=String(s||'').trim();return(!v||v.length>40)?v.slice(0,40):v;}
    function getNameLocal(){return normName(localStorage.getItem(LS_USER_NAME_A)||localStorage.getItem(LS_USER_NAME_B)||'');}
    async function tryLoadName(){
      if(!db)return'';const{data,error}=await db.auth.getUser();if(error)return'';
      const u=data?.user||null;if(!u)return'';const meta=u.user_metadata||{};
      return normName(meta.full_name||meta.name||meta.username||'');
    }

    /* ── PICK / SELECTION ── */
    function ensureMistakeKeys(rows){
      const seen=new Set();let changed=false;
      const normalized=(Array.isArray(rows)?rows:[]).map((m,index)=>{
        if(!m||typeof m!=='object'||Array.isArray(m))return m;
        let key=String(m.mistake_key||'');
        if(!key)key=`legacy:${Number(m.ts||0)}:${m.course||''}:${m.id||''}:${m.question||''}:${index}`;
        if(seen.has(key))key=`${key}:${index}`;
        seen.add(key);
        if(key!==m.mistake_key){changed=true;return{...m,mistake_key:key};}
        return m;
      });
      if(changed)lsSet(LS_MISTAKES,normalized);
      return normalized;
    }
    function mKey(m){return String(m?.mistake_key||'');}
    function getPick(){const p=lsObj(LS_TRAIN_PICK)||{};return{keys:Array.isArray(p.keys)?p.keys.map(String):[],mode:p.mode==='all'?'all':'selected',course:String(p.course||'')};}
    function setPick(p){lsSet(LS_TRAIN_PICK,p);updateSelPill();}
    function togglePickKey(key){const p=getPick(),keys=new Set(p.keys),skey=String(key);if(keys.has(skey))keys.delete(skey);else keys.add(skey);p.keys=Array.from(keys);p.mode='selected';p.course=String($('courseFilter')?.value||'');setPick(p);}
    function clearPick(){setPick({keys:[],mode:'selected',course:String($('courseFilter')?.value||'')});}
    /* Räknaren äger radens tillstånd: texten, mätaren, om primärhandlingen går
       att trycka på och om "Rensa" alls syns. Ett enda ställe, så raden inte kan
       säga en sak och bete sig som en annan.

       "Träna markerade" var tidigare klickbar vid noll valda och skickade eleven
       till träningsläget med ett tomt urval — en återvändsgränd som såg ut som
       en väg. */
    function updateSelPill(){
      const el=$('selCountPill'); if(!el)return;
      const p=getPick();
      const n=Array.isArray(p.keys)?p.keys.length:0;
      const totalt=document.querySelectorAll('#mistakeList .xf-opt').length;

      el.textContent = n
        ? `${n} av ${totalt} valda`
        : (totalt ? 'Markera det du vill träna' : 'Inget att träna på just nu');

      const fill=$('trainMeterFill');
      if(fill) fill.style.width = (totalt ? Math.round((n/totalt)*100) : 0) + '%';

      const go=$('trainSelectedBtn');
      if(go) go.disabled = n === 0;

      /* "Rensa" göms när det inte finns något att rensa. En knapp som inte kan
         göra något är brus, inte en möjlighet. */
      const clear=$('clearSelectionBtn');
      if(clear) clear.hidden = n === 0;
    }
    function removeMistake(m){const all=lsArr(LS_MISTAKES),k=mKey(m);lsSet(LS_MISTAKES,all.filter(x=>mKey(x)!==k));const p=getPick();if(p.keys.includes(k)){p.keys=p.keys.filter(x=>x!==k);setPick(p);}}

    /* ── PER COACH ── */
    const PER_COACH_TTL = 24 * 60 * 60 * 1000;
    function getCoachCache(){const o=lsObj(LS_PER_COACH_CACHE);return(o&&typeof o==='object')?o:null;}
    function setCoachCache(data){lsSet(LS_PER_COACH_CACHE,data);}
    function isCoachCacheFresh(c){return c&&c.text&&(Date.now()-(c.ts||0))<PER_COACH_TTL;}

    async function fetchPERCoach(h,m){
      if(!db) return null;
      const{data:sd}=await db.auth.getSession();
      const token=sd?.session?.access_token||'';
      if(!token) return null;

      const avg5=avgPct(scoredHistory(h).slice(-5));
      const courseFreq={};
      m.slice(-30).forEach(x=>{const c=String(x.course||'').trim();if(c)courseFreq[c]=(courseFreq[c]||0)+1;});
      const topCourses=Object.entries(courseFreq).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c,n])=>`${c}(${n})`).join(', ');
      const weakAreas=Object.keys(courseFreq).sort((a,b)=>courseFreq[b]-courseFreq[a]).slice(0,5);
      const recentQ=m.slice(-5).map(x=>String(x.question||'').slice(0,80)).filter(Boolean).join(' | ');

      const context=[
        `${h.length} prov gjorda.`,
        avg5===null?'Resultatsnitt saknas eftersom prov saknar poängunderlag.':`Snitt av prov med poängunderlag, senaste 5: ${avg5}%.`,
        topCourses?`Mest misstag i: ${topCourses}.`:'',
        recentQ?`Senaste misstag: ${recentQ}.`:''
      ].filter(Boolean).join(' ');

      const r=await fetch('/api/explain',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({
          topic:'studiecoach',
          context,
          weakAreas,
          userQuestion:'Analysera min provhistorik och ge mig en personlig rekommendation för att förbättra mina resultat.'
        })
      });
      const data=await r.json();
      if(!r.ok)throw new Error(data?.error||'failed');
      return data?.answer||null;
    }

    /* ── SMART TIPS ── */
    function tipsCKey(m){return`${String(m.course||'').trim()}::${String(m.id||'').trim()}`;}
    function getTipsCache(){const o=lsObj(LS_SMART_TIPS_CACHE);return(o&&typeof o==='object')?o:{};}
    function setTipsCache(c){lsSet(LS_SMART_TIPS_CACHE,c);}
    async function fetchTips(m){
      const{data:sd}=await db.auth.getSession();
      const token=sd?.session?.access_token||'';
      const res=await fetch('/api/explain',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({tipsMode:true,question:m.question,feedback:m.feedback,model_answer:m.model_answer,course:m.course})});
      const data=await res.json();if(!res.ok)throw new Error(data?.error||'failed');return String(data?.tips||'');
    }

    /* ── TEACHER REPORT ── */
    try{localStorage.removeItem(LS_TEACHER_REPORT_CACHE);}catch{}
    let reportCount=0;
    let reportOwner=null;
    /* Vilken kurs eleven tittar på. Väljaren bor i felbank-skärmen, men alla
       fem skärmar ritas av renderAll() så elementet finns i DOM:en oavsett
       vilken som är framme. Beroendet är osynligt och därför samlat här och
       kontrollerat av forbattring-flow.mjs F19 — utan det kunde rapporten
       tyst börja omfatta alla kurser om felbanken en dag ritas lazily. */
    function currentCourse(){ return String($('courseFilter')?.value||'').trim(); }
    window.__reportScopeForTest=()=>currentCourse();
    async function fetchReport(payload){
      const{data:sd}=await db.auth.getSession();
      const token=sd?.session?.access_token||'';
      const owner=sd?.session?.user?.id||'';
      if(!token)throw new Error('Logga in igen för att skapa rapporten.');
      const res=await fetch('/api/teacher-report',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
      const{data:current}=await db.auth.getSession();
      if(!owner||current?.session?.user?.id!==owner)throw new Error('Kontot ändrades medan rapporten skapades. Försök igen på rätt konto.');
      const data=await res.json();if(!res.ok)throw new Error(data?.error||'Kunde inte skapa rapport.');
      const{data:afterRead}=await db.auth.getSession();
      if(afterRead?.session?.user?.id!==owner)throw new Error('Kontot ändrades medan rapporten skapades. Försök igen på rätt konto.');
      return {text:String(data?.report||''),count:Number(data?.exams_count||0),owner};
    }
    function setReportText(t){const b=$('reportBox');if(b)b.textContent=t;}
    function setReportStatus(t,c){const s=$('reportStatus');if(!s)return;s.textContent=t;s.className='statusText'+(c?' '+c:'');}
    function setReportPill(t,show){const p=$('reportPill');if(!p)return;p.textContent=t;p.style.display=show?'inline-flex':'none';}
    function setCopyEnabled(e){const b=$('copyReportBtn');if(!b)return;e?b.removeAttribute('disabled'):b.setAttribute('disabled','disabled');}
    function setGenEnabled(e){const b=$('genReportBtn');if(!b)return;e?b.removeAttribute('disabled'):b.setAttribute('disabled','disabled');}

    /* ── LOADING OVERLAY ── */
    let _lt=null;
    function showLoad(){const o=$('reportLoadingOverlay');if(o)o.classList.add('on');setGenEnabled(false);['loadStep1','loadStep2','loadStep3'].forEach(id=>{const e=$(id);if(e)e.classList.remove('on');});const e0=$('loadStep1');if(e0)e0.classList.add('on');let i=0;const steps=['loadStep1','loadStep2','loadStep3'];_lt=setInterval(()=>{i++;if(i<steps.length){const e=$(steps[i]);if(e)e.classList.add('on');}},900);}
    function hideLoad(){const o=$('reportLoadingOverlay');if(o)o.classList.remove('on');setGenEnabled(true);if(_lt){clearInterval(_lt);_lt=null;}['loadStep1','loadStep2','loadStep3'].forEach(id=>{const e=$(id);if(e)e.classList.remove('on');});}

    /* ── CHART ── */
    let _chart=null;
    function renderChartFallback(wrap,canvas,data){
      canvas.hidden=true;
      const fallback=document.createElement('div');
      fallback.id='chartFallback';
      fallback.className='chartFallback';
      fallback.setAttribute('role','status');
      fallback.setAttribute('aria-live','polite');
      const message=document.createElement('p');
      message.textContent='Grafen kunde inte laddas. Resultaten finns i den utfällbara tabellen.';
      const list=document.createElement('ol');
      list.className='chartFallbackList';
      data.slice(-5).forEach(item=>{
        const row=document.createElement('li');
        const date=chartDate(item.ts,{month:'short',day:'numeric'});
        const percent=chartPercent(item.percent);
        row.textContent=`${date}: ${percent!==null?`${percent}%`:'Resultat saknas'}`;
        list.appendChild(row);
      });
      fallback.append(message,list);
      wrap.appendChild(fallback);
    }
    function chartDate(value,options){
      const time=typeof value==='number'?value:Date.parse(value);
      return Number.isFinite(time)&&time>0?new Date(time).toLocaleDateString(undefined,options):'Datum saknas';
    }
    function chartPercent(value){
      if((typeof value!=='number'&&typeof value!=='string')||(typeof value==='string'&&value.trim()===''))return null;
      const percent=Number(value);
      return Number.isFinite(percent)&&percent>=0&&percent<=100?percent:null;
    }
    function renderChartTable(data){
      const rows=$('chartDataRows');if(!rows)return;
      rows.replaceChildren();
      data.forEach(item=>{
        const row=document.createElement('tr');
        const dateCell=document.createElement('td');
        dateCell.textContent=chartDate(item.ts,{year:'numeric',month:'short',day:'numeric'});
        const resultCell=document.createElement('td');
        const percent=chartPercent(item.percent);
        resultCell.textContent=percent!==null?`${percent}%`:'Resultat saknas';
        row.append(dateCell,resultCell);
        rows.appendChild(row);
      });
    }
    function renderChart(h){
      const wrap=$('chartWrap'),canvas=$('progressChart');if(!wrap||!canvas)return;
      $('chartFallback')?.remove();
      canvas.hidden=false;
      if(!h||h.length<2){wrap.style.display='none';if(_chart){_chart.destroy();_chart=null;}return;}
      wrap.style.display='block';
      const data=h.slice(-20);
      renderChartTable(data);
      canvas.setAttribute('aria-label',`Resultatgraf med ${data.length} prov. Resultaten visas i procent över tid.`);
      const labels=data.map(x=>chartDate(x.ts,{month:'2-digit',day:'2-digit'}));
      const values=data.map(x=>chartPercent(x.percent));
      const grid='rgba(0,183,217,.07)',tick='#667085';
      const line='#00768F',fill='rgba(0,183,217,.08)';
      if(_chart){_chart.destroy();_chart=null;}
      if(typeof Chart!=='function'){renderChartFallback(wrap,canvas,data);return;}
      try{_chart=new Chart(canvas,{
        type:'line',

    /* ── RENDER MISTAKES ── */
    function renderMistakes(mistakes,courseFilter){
      mistakes=ensureMistakeKeys(mistakes);
      const list=$('mistakeList'),st=$('mistakeStatus');
      list.innerHTML='';
      const course=(courseFilter||'').trim();
      const inCourse=course?mistakes.filter(m=>String(m.course||'').trim()===course):mistakes;
      // Åtgärdsraden hör till listan. Utan rader finns ingenting att markera,
      // och "Träna markerade" ovanför ett gratulationsmeddelande erbjuder en
      // handling som inte går att utföra.
      const bar=$('trainActions');
      if(bar)bar.style.display=inCourse.length?'':'none';

      if(!inCourse.length){
        st.textContent='';st.className='statusText';
        const es=document.createElement('div');es.className='emptyState';
        es.innerHTML=`<div class="emptyIcon">🎉</div><div class="emptyTitle">Felbanken är tom!</div><div class="emptyDesc">Inga tappade poäng just nu. Fortsätt träna.</div>`;
        list.appendChild(es);return;
      }

      // Level 2: concepts within the selected course. Drop a stale filter that
      // no longer matches anything so the list can never render empty-by-filter.
      const counts=conceptCounts(inCourse);
      const untagged=inCourse.filter(m=>!conceptOf(m)).length;
      const valid=new Set(counts.map(c=>c[0]));
      if(CONCEPT_FILTER&&CONCEPT_FILTER!=='__none__'&&!valid.has(CONCEPT_FILTER))CONCEPT_FILTER='';
      if(CONCEPT_FILTER==='__none__'&&!untagged)CONCEPT_FILTER='';

      const filtered=!CONCEPT_FILTER?inCourse
        :CONCEPT_FILTER==='__none__'?inCourse.filter(m=>!conceptOf(m))
        :inCourse.filter(m=>conceptOf(m)===CONCEPT_FILTER);

      if(counts.length){
        const bar=document.createElement('div');bar.className='conceptBar';
        const chips=[['','Alla begrepp',inCourse.length]]
          .concat(counts.map(c=>[c[0],c[0],c[1]]));
        if(untagged)chips.push(['__none__','Otaggade',untagged]);
        bar.innerHTML=`<span class="conceptBarLabel">${'Begrepp'}</span>`+chips.map(c=>
          `<button type="button" class="conceptChip${CONCEPT_FILTER===c[0]?' active':''}" data-concept="${esc(c[0])}" aria-pressed="${CONCEPT_FILTER===c[0]?'true':'false'}">${esc(c[1])}<span class="conceptChipN">${c[2]}</span></button>`
        ).join('');
        bar.querySelectorAll('.conceptChip').forEach(btn=>{
          btn.addEventListener('click',()=>{CONCEPT_FILTER=btn.dataset.concept||'';renderAll();});
        });
        list.appendChild(bar);
      }

      const shownConcept=CONCEPT_FILTER==='__none__'?'Otaggade':CONCEPT_FILTER;
      const scope=[course,shownConcept].filter(Boolean).join(' › ');
      st.textContent=`${filtered.length} misstag${scope?' · '+scope:''}`;st.className='statusText';
      const pick=getPick(),pickSet=new Set(pick.keys);
      /* Hur många gånger varje begrepp återkommer i det eleven ser just nu.
         Det är den enda signalen som säger vad som ska prioriteras — fyra
         identiska kort säger ingenting om vilket misstag som är ett mönster
         och vilket som var en engångshändelse. */
      const begreppsAntal={};
      filtered.forEach(x=>{const c=conceptOf(x);if(c)begreppsAntal[c]=(begreppsAntal[c]||0)+1;});
      const tc=getTipsCache();
      const grid=document.createElement('div');grid.className='mistakeGrid';
      list.appendChild(grid);
      filtered.slice().sort((a,b)=>Number(b.ts||0)-Number(a.ts||0)).forEach(m=>{
        // Raden ÄR markeringen. .xf-opt.sel ritar accentkanten på insidan via
        // ::before, så raden inte hoppar en pixel när den väljs — kryssrutan
        // som låg här förut var en andra kontroll för ett tillstånd raden redan
        // kunde bära.
        const d=document.createElement('article');
        const date=new Date(m.ts||Date.now()).toLocaleDateString(undefined,{month:'2-digit',day:'2-digit'});
        const key=mKey(m),isPicked=pickSet.has(key),cKey=tipsCKey(m),tipsId='per-tips-'+encodeURIComponent(key),hasCached=!!(tc[cKey]);
        const cTag=conceptOf(m),eTags=errorTagsOf(m).slice(0,3);
        const antal=cTag?(begreppsAntal[cTag]||0):0;
        d.className='xfMiss'+(isPicked?' sel':'');

        /* Begreppet står ensamt i huvudet. Felkoderna flyttade ned till
           detaljen, bredvid feedbacken de förklarar — i huvudet var de brus:
           samma två koder på varje kort, tyngre satta än frågan de gällde. */
        const huvudHtml=
          '<div class="xfMissHead">'+
            (cTag?`<span class="xfMissConcept">${esc(cTag)}</span>`:'<span class="xfMissConcept xfMissConcept--none">Otaggad</span>')+
            (antal>1?`<span class="xfMissRepeat">återkommer ${antal} ggr</span>`:'')+
            `<span class="xfMissScore">${m.points}/${m.max_points}</span>`+
          '</div>';

        const kodHtml=eTags.length
          ? `<div class="xf-chips xfMissCodes">${eTags.map(x=>`<span class="xf-chip">${esc(errLabel(x))}</span>`).join('')}</div>`
          : '';

        d.innerHTML=`
          <button type="button" class="xf-opt xfMissRow" data-id="${esc(m.id)}" data-mistake-key="${esc(key)}"
                  aria-pressed="${isPicked?'true':'false'}">
            ${huvudHtml}
            <span class="xfMissQ">${esc(m.question||'')}</span>
            <span class="xfMissMeta">${esc((m.course||'').trim()||'ingen kurs')} · ${date}</span>
          </button>
          <div class="xfMissMore" data-per-avoid>
            <button type="button" class="xfDisclose" aria-expanded="false">Visa svar</button>
            <button class="xfDisclose doneBtn" type="button">Klar</button>
            <button class="xfDisclose tipsBtnEl" type="button" aria-expanded="false" aria-controls="${esc(tipsId)}">P.E.R-tips${hasCached?' <span class="xfCached">cache</span>':''}</button>
          </div>
          <div class="xf-note xfMissDetail" hidden>
            <div class="mFL">Ditt svar</div>
            <div class="mFV">${esc(m.user_answer||'—')}</div>
            <div class="mFL">Feedback</div>
            <div class="mFV">${esc(m.feedback||'—')}</div>
            ${kodHtml}
            <div class="mFL">Modellsvar</div>
            <div class="mFV">${esc(m.model_answer||'—')}</div>
          </div>
          <div class="tipsBox tipsBoxEl" id="${esc(tipsId)}" role="status" aria-live="polite" aria-atomic="true" hidden></div>`;

        // Markering: hela raden.
        /* Markeringen sitter på KORTET, inte bara på frågeraden. Kortet är
           det eleven ser som en enhet, så det är kortet som ska se valt ut.

           Klicket målar om kortet DIREKT. Tidigare satte togglePickId bara
           lagringen och räknaren, medan .sel lades på vid render — så ett klick
           gav ingen synlig återkoppling alls förrän listan råkade ritas om.
           Eleven markerade i blindo. */
        const rad=d.querySelector('.xfMissRow');
        rad?.addEventListener('click',()=>{
          togglePickKey(key);
          const valt=getPick().keys.includes(key);
          d.classList.toggle('sel',valt);
          rad.setAttribute('aria-pressed',valt?'true':'false');
        });
        // Detaljen: egen kontroll, egen rad under. Ingen stopPropagation
        // behövs eftersom knapparna ligger utanför .xf-opt, inte inuti den —
        // en knapp i en knapp är ogiltig HTML och hade dessutom gjort det
        // omöjligt att gissa vad ett klick gör.
        const det=d.querySelector('.xfMissDetail'),disc=d.querySelector('.xfDisclose');
        disc?.addEventListener('click',()=>{
          const open=det.hasAttribute('hidden');
          if(open)det.removeAttribute('hidden');else det.setAttribute('hidden','');
          disc.setAttribute('aria-expanded',open?'true':'false');
          disc.textContent=open?'Dölj svar':'Visa svar';
        });
        d.querySelector('.doneBtn')?.addEventListener('click',()=>{removeMistake(m);renderAll();});
        const tBtn=d.querySelector('.tipsBtnEl'),tBox=d.querySelector('.tipsBoxEl');
        const isTipsVis=()=>!tBox.hasAttribute('hidden');
        tBtn?.addEventListener('click',async()=>{
          if(isTipsVis()){tBox.setAttribute('hidden','');tBox.textContent='';tBtn.setAttribute('aria-expanded','false');return;}
          tBtn.setAttribute('aria-expanded','true');
          const cache=getTipsCache(),cached=cache[cKey];
          tBox.removeAttribute('hidden');
          if(cached){tBox.textContent=String(cached);return;}
          tBtn.setAttribute('disabled','disabled');tBox.textContent='P.E.R analyserar…';
          try{const text=await fetchTips(m),norm=String(text||'').trim();if(!norm){tBox.textContent='Kunde inte hämta tips — försök igen.';}else{const c2=getTipsCache();c2[cKey]=norm;setTipsCache(c2);tBox.textContent=norm;}}
          catch{tBox.textContent='Kunde inte hämta tips — försök igen.';}
          finally{tBtn.removeAttribute('disabled');}
        });
        grid.appendChild(d);
      });
    }

    /* ── BUILD COURSE OPTIONS ── */
    /* Rebuilding the <option> list wipes the current selection, so the value has
       to be captured first and put back. Restoring from the saved pick is only
       correct on the first populated render — after that the student's own
       choice wins, otherwise selecting "Alla kurser" would snap straight back
       to the picked course and the filter could not be cleared. */
    let COURSE_OPTS_INIT=false;
    function buildCourseOpts(h,m){
      const set=new Set();
      h.forEach(x=>{const c=String(x.course||'').trim();if(c)set.add(c);});
      m.forEach(x=>{const c=String(x.course||'').trim();if(c)set.add(c);});
      const arr=Array.from(set).sort((a,b)=>a.localeCompare(b));
      const sel=$('courseFilter');
      const current=String(sel.value||'').trim();
      sel.innerHTML='';
      const o=document.createElement('option');o.value='';o.textContent='Alla kurser';sel.appendChild(o);
      arr.forEach(c=>{const o2=document.createElement('option');o2.value=c;o2.textContent=c;sel.appendChild(o2);});
      const pick=getPick();
      sel.value=(!COURSE_OPTS_INIT&&pick?.course&&arr.includes(pick.course))?pick.course
        :(arr.includes(current)?current:'');
      if(arr.length)COURSE_OPTS_INIT=true;
    }

    /* ── SYNC ── */
    function stableJSON(value){if(Array.isArray(value))return'['+value.map(stableJSON).join(',')+']';if(value&&typeof value==='object')return'{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stableJSON(value[k])).join(',')+'}';return JSON.stringify(value);}
    function canonicalTimestamp(value){
      const input=String(value||''),match=input.match(/^(\d{4}-\d{2}-\d{2})[Tt ](\d{2}:\d{2})(?::(\d{2}))?(?:[.,](\d+))?(Z|[+-]\d{2}(?::?\d{2})?)?$/i);
      if(!match)return input;
      const base=Date.parse(`${match[1]}T${match[2]}:${match[3]||'00'}${match[5]||''}`);
      if(!Number.isFinite(base))return input;
      const seconds=new Date(Math.floor(base/1000)*1000).toISOString().replace('.000Z','');
      const fraction=String(match[4]||'').replace(/0+$/g,'');
      return`${seconds}${fraction?'.'+fraction:''}Z`;
    }
    function legacyTrainingBatchId(record){
      const exam=record?.exam&&typeof record.exam==='object'?{...record.exam}:null;
      if(exam)delete exam.training_batch_id;
      const input=stableJSON([canonicalTimestamp(record?.created_at),String(record?.course||''),String(record?.level||''),String(record?.qtype||record?.qType||''),String(record?.material||''),exam,record?.answers||null,record?.result||null]);
      const lanes=[2166136261,0x9e3779b9,0x85ebca6b,0xc2b2ae35],primes=[16777619,2246822519,3266489917,668265263];
      for(let i=0;i<input.length;i++){const c=input.charCodeAt(i);for(let lane=0;lane<lanes.length;lane++)lanes[lane]=Math.imul(lanes[lane]^c,primes[lane]);}
      return'legacy-'+lanes.map(value=>(value>>>0).toString(16).padStart(8,'0')).join('');
    }
    function stableMistakeSignature(item){return stableJSON([Number(item?.ts||0),String(item?.course||''),String(item?.id||''),String(item?.question||''),String(item?.user_answer||''),String(item?.feedback||''),String(item?.model_answer||''),Number(item?.points||0),Number(item?.max_points||0)]);}
    function migrateTrainingPick(oldMistakes,newMistakes){
      const pick=lsObj(LS_TRAIN_PICK);if(!Array.isArray(pick?.keys)||!pick.keys.length)return;
      const nextKeys=new Set((newMistakes||[]).map(item=>String(item?.mistake_key||''))),available=new Map();
      (newMistakes||[]).forEach(item=>{const sig=stableMistakeSignature(item);if(!available.has(sig))available.set(sig,[]);available.get(sig).push(String(item?.mistake_key||''));});
      const oldByKey=new Map((oldMistakes||[]).map(item=>[String(item?.mistake_key||''),item])),consumed=new Set(),mapped=[];
      for(const selected of pick.keys.map(String)){
        if(nextKeys.has(selected)){mapped.push(selected);continue;}
        const legacy=oldByKey.get(selected),bucket=legacy?available.get(stableMistakeSignature(legacy)):null;
        const replacement=bucket?.find(key=>key&&!consumed.has(key));
        if(replacement){mapped.push(replacement);consumed.add(replacement);}else mapped.push(selected);
      }
      const keys=Array.from(new Set(mapped));
      if(keys.length!==pick.keys.length||keys.some((key,index)=>key!==String(pick.keys[index]||'')))lsSet(LS_TRAIN_PICK,{...pick,keys});
    }
    function mergeMistakes(rows){
      const out=[];
      (rows||[]).forEach(r=>{
        const cTs=Date.parse(r.created_at)||0;
        const exam=r.exam||null,result=r.result||null,answers=r.answers||null;
        const batchId=String(exam?.training_batch_id||r.submission_id||legacyTrainingBatchId(r));
        const qById=new Map(((exam&&exam.questions)?exam.questions:[]).map(q=>[String(q.id),q]));
        const aById=new Map((Array.isArray(answers)?answers:[]).map(a=>[String(a.id),String(a.answer||'')]));
        const per=(result&&Array.isArray(result.per_question))?result.per_question:[];
        per.forEach((item,questionIndex)=>{
          const got=Number(item.points||0),mx=Number(item.max_points||0);
          if(mx>0&&got<mx){const qid=String(item.id),q=qById.get(qid)||{};
            out.push({mistake_key:`exam:${batchId}:${questionIndex}`,ts:cTs||Date.now(),course:r.course||'',level:r.level||'C',qType:q.type||(r.qtype||'mix'),id:qid,question:String(q.question||''),user_answer:String(aById.get(qid)||''),feedback:String(item.feedback||''),model_answer:String(item.model_answer||''),points:got,max_points:mx,concept_tag:String(item.concept_tag||''),error_tags:Array.isArray(item.error_tags)?item.error_tags:[]});}
        });
      });
      while(out.length>200)out.shift();return out;
    }
    async function syncFromAccount(){
      const st=$('examListStatus'),syncBtn=$('syncBtn');
      if(!db){if(st){st.textContent='Supabase ej konfigurerad.';st.className='statusText warn';}return;}
      if(st){st.textContent='Synkar…';st.className='statusText';}
      if(syncBtn)syncBtn.setAttribute('disabled','disabled');
      const r=await fetchUserExams();
      if(!r.ok){if(st){st.textContent=String(r.error||'Sync error');st.className='statusText bad';}if(syncBtn)syncBtn.removeAttribute('disabled');return;}
      const rows=r.rows||[];
      const h=rows.map(row=>{
        const totalRaw=row.result?.total_points,maxRaw=row.result?.max_points;
        const total=Number(totalRaw),maximum=Number(maxRaw);
        const hasScore=(typeof totalRaw==='number'||typeof totalRaw==='string')&&!(typeof totalRaw==='string'&&totalRaw.trim()==='')&&(typeof maxRaw==='number'||typeof maxRaw==='string')&&!(typeof maxRaw==='string'&&maxRaw.trim()==='')&&Number.isFinite(total)&&Number.isFinite(maximum)&&maximum>0&&total>=0&&total<=maximum;
        return {ts:Date.parse(row.created_at)||Date.now(),course:row.course||'',level:row.level||'C',qType:row.qtype||'mix',total_points:hasScore?total:null,max_points:hasScore?maximum:null,percent:hasScore?Math.round((total/maximum)*100):null};
      });
      lsSet(LS_HISTORY,h);
      const last2=rows.length?rows[rows.length-1]:null;
      if(last2){lsSet(LS_LAST,{ts:Date.parse(last2.created_at)||Date.now(),attempt:h[h.length-1],exam:last2.exam,result:last2.result});if(typeof last2.material==='string')localStorage.setItem(LS_MATERIAL,last2.material);}
      else localStorage.removeItem(LS_LAST);
      const oldMistakes=lsArr(LS_MISTAKES),newMistakes=mergeMistakes(rows);
      migrateTrainingPick(oldMistakes,newMistakes);lsSet(LS_MISTAKES,newMistakes);
      if(st){st.textContent='Synkat';st.className='statusText ok';}
      if(syncBtn)syncBtn.removeAttribute('disabled');
      renderAll();
    }


    /* ── SKÄRMARNA ────────────────────────────────────────────────────────
       Sidan var fyra zoner uppe samtidigt, i en ordning som motsade sina egna
       kommentarer: DOM:en gav Prov, Coach, Rapport, Felbank medan
       kommentarerna numrerade dem 1, 3, 3, 2. Felbanken kallades "kärnan" i
