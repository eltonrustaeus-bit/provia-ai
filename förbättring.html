    /* ── NÄSTA STEG ──
       decideNextFocus() på servern räknade redan ut vad eleven borde göra
       härnäst, men resultatet gick bara in i P.E.R:s prompt — det syntes
       ingenstans om man inte frågade. Här visas det oombedt.

       Beslutet är deterministiskt kod, inte en modell: vyn kostar ingen token
       och ger samma svar varje gång. En AI-genererad rekommendation vid varje
       sidladdning hade varit både dyr och olika från gång till gång. */
    let nextFocus=null, nextFocusHamtad=false;

    async function hamtaNextFocus(){
      if(nextFocusHamtad) return nextFocus;
      nextFocusHamtad=true;
      try{
        const{data:sd}=await db.auth.getSession();
        const token=sd?.session?.access_token||'';
        if(!token) return null;
        const r=await fetch('/api/check-role',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify({action:'next_focus'})
        });
        const d=await r.json().catch(()=>({}));
        if(r.ok&&d.ok) nextFocus=d;
      }catch(_){ /* rekommendationen är en bonus, aldrig ett skäl att fela sidan */ }
      return nextFocus;
    }

    /* Kortet ritas bara när servern faktiskt har ett belagt begrepp att peka på.
       Ett tomt "nästa steg"-kort på ett konto utan data är brus, och en
       rekommendation utan skäl är en order — därför alltid båda eller ingen. */
    function ritaNextFocus(container){
      if(!nextFocus||!nextFocus.focus) return;
      const f=nextFocus.focus;

      const kort=document.createElement('div');
      kort.className='xfNextFocus';

      const eyebrow=document.createElement('span');
      eyebrow.className='xf-eyebrow';
      eyebrow.textContent='P.E.R rekommenderar';
      kort.appendChild(eyebrow);

      const rubrik=document.createElement('div');
      rubrik.className='xfNextFocusTitle';
      rubrik.textContent=f.title+' '+f.label;
      kort.appendChild(rubrik);

      if(f.reason){
        const skal=document.createElement('div');
        skal.className='xfNextFocusWhy';
        skal.textContent=f.reason;
        kort.appendChild(skal);
      }

      /* Begreppen visas i ord, aldrig som siffra. Skalan 0-100 är intern —
         ingen har förklarat vad 47 betyder och ingen lärare har satt den, så
         en siffra här hade lästs som ett betyg. */
      const lista=(nextFocus.concepts||[]).slice(0,6);
      if(lista.length){
        const rad=document.createElement('div');
        rad.className='xfNextFocusChips';
        lista.forEach(c=>{
          const chip=document.createElement('span');
          chip.className='xfChip xfChip--'+String(c.level||'').replace(/\s+/g,'-');
          chip.textContent=c.label+' · '+c.level;
          rad.appendChild(chip);
        });
        kort.appendChild(rad);
      }

      container.appendChild(kort);
    }

    /* ── INGÅNGEN ──
       Vägarna bär sitt eget tillstånd i undertexten. En väg som inte går att
       ta säger varför — en spärrad knapp utan skäl är en återvändsgränd. */
    function renderHem(){
      const {h,m}=data();
      const scoredRecent=scoredHistory(h).slice(-5);
      const avg=avgPct(scoredRecent);

      if(!h.length){
        flow.say('hem','Här samlas det du missar.',
          'Rätta ett prov i appen så börjar jag hålla räkningen åt dig.');
      }else{
        const tally={};
        m.forEach(x=>{const c=String(x.course||'').trim();if(c)tally[c]=(tally[c]||0)+1;});
        const top=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
        const progressText=avg===null
          ? 'Poängunderlag saknas för att räkna ut ett snitt ännu.'
          : `Snittet är ${avg} % över dina senaste ${scoredRecent.length} prov med resultat.`;
        flow.say('hem',`Du har ${m.length} sparade fel.`,
          (top&&tally[top]>1)?`${tally[top]} av dem i ${top}. ${progressText}`:progressText);
      }

      const body=flow.body('hem');
      ritaNextFocus(body);
      const opts=document.createElement('div');
      opts.className='xf-opts';
      body.appendChild(opts);

      const mostC=mostMistakeCourse(m);
      const lastP=h.length?chartPercent(h[h.length-1].percent):null;
      const cache=getCoachCache();

      [
        { go:'felbank', label:'Träna det du missat',
          small:m.length?`${m.length} fel${mostC.course?' · flest i '+mostC.course:''}`:'Inga sparade fel just nu',
          av:!m.length },
        { go:'prov', label:'Se dina prov',
          small:h.length?`${h.length} prov · senaste ${lastP===null?'resultat saknas':`${lastP} %`}`:'Inga prov ännu',
          av:!h.length },
        { go:'coach', label:'Fråga P.E.R vad du ska göra',
          small:isCoachCacheFresh(cache)?'analys från senaste dygnet':'ny analys av din historik',
          av:!h.length },
        { go:'rapport', label:'Skapa övningsrapport',
          small:'minst 3 verifierat rättade prov',
          av:false }
      ].forEach(v=>{
        const b=document.createElement('button');
        b.type='button'; b.className='xf-opt'; b.dataset.go=v.go; b.disabled=!!v.av;
        b.appendChild(document.createTextNode(v.label));
        const sm=document.createElement('small'); sm.textContent=v.small; b.appendChild(sm);
        if(!v.av)b.addEventListener('click',()=>flow.show(v.go));
        opts.appendChild(b);
      });

      if(!h.length){
        const act=document.createElement('div'); act.className='xf-act';
        const a=document.createElement('a');
        a.className='xf-btn primary'; a.href='app.html'; a.textContent='Gör ett prov i appen';
        act.appendChild(a); body.appendChild(act);
      }
    }

    /* ── FELBANK ── kärnan, ett klick från ingången. Kursväljaren och
       begreppschipsen sitter direkt ovanför listan de filtrerar; förut satt
       väljaren i zon 1 och listan i zon 4. */
    function renderFelbank(){
      const d=data();
      flow.say('felbank','Felbank', d.m.length
        ? `${d.m.length} frågor du tappat poäng på. Markera dem du vill träna.`
        : 'Inga sparade fel just nu.');

      const body=flow.body('felbank');
      backBtn(body);

      const filt=document.createElement('div');
      filt.className='xf-act xfFilters';
      filt.innerHTML='<label class="xfField">'+
        '<span class="xf-eyebrow" id="courseFilterLabel">Kurs</span>'+
        '<select class="xf-input" id="courseFilter" aria-labelledby="courseFilterLabel"></select>'+
        '</label>';
      body.appendChild(filt);

      const bar=document.createElement('div');
      bar.className='xf-act--stick xfTrainBar'; bar.id='trainActions';
      /* Mätaren är inte dekoration. Den svarar på "hur mycket av det jag ser
         har jag valt", vilket är den enda frågan raden finns för — och den gör
         att raden bär information även när man inte tittar på siffran. */
      bar.innerHTML=
        '<div class="xfTrainMeter" aria-hidden="true"><i id="trainMeterFill"></i></div>'+
        '<div class="xfTrainRow">'+
          '<p class="xfTrainCount" id="selCountPill" aria-live="polite">Inget valt än</p>'+
          '<div class="xfTrainActs">'+
            '<button class="xf-btn quiet xfTrainClear" id="clearSelectionBtn" type="button">Rensa</button>'+
            '<button class="xf-btn primary xfTrainGo" id="trainSelectedBtn" type="button" disabled>Träna markerade</button>'+
          '</div>'+
        '</div>';
      body.appendChild(bar);

      const st=document.createElement('div');
      st.className='statusText'; st.id='mistakeStatus'; st.setAttribute('aria-live','polite');
      body.appendChild(st);
      const list=document.createElement('div'); list.id='mistakeList';
      body.appendChild(list);

      buildCourseOpts(d.h,d.m);
      const kurs=()=>String($('courseFilter').value||'').trim();
      renderMistakes(d.m,kurs());
      updateSelPill();

      /* Ritar bara om sin EGEN lista. renderAll() hade ritat om fem skärmar
         och flyttat fokus för att en rad markerades. */
      const om=()=>{ renderMistakes(lsArr(LS_MISTAKES),kurs()); updateSelPill(); };
      $('courseFilter').addEventListener('change',()=>{CONCEPT_FILTER='';om();});
      $('clearSelectionBtn').addEventListener('click',()=>{clearPick();om();});
      $('trainSelectedBtn').addEventListener('click',()=>{
        const p=getPick();
        /* Knappen är avstängd utan urval, men villkoret står kvar som andra
           spärr: disabled är ett gränssnittstillstånd, inte en garanti. */
        if(!p.keys.length)return;
        p.mode='selected';setPick(p);
        window.location.href='app.html#train';
      });
    }

    /* ── PROV ── resultatgrafen flyttar hit från Coach-zonen. Den handlar om
       prov. */
    function renderProv(){
      const d=data();
      flow.say('prov','Dina prov', d.h.length
        ? `${d.h.length} rättade prov. Klicka ett för att se vad du tappade poäng på.`
        : 'Inga prov ännu.');

      const body=flow.body('prov');
      backBtn(body);

      const act=document.createElement('div');
      act.className='xf-act';
      act.innerHTML='<button class="xf-btn ghost" id="syncBtn" type="button">↻ Synka</button>';
      body.appendChild(act);

      const st=document.createElement('div');
      st.className='statusText'; st.id='examListStatus'; st.setAttribute('aria-live','polite');
      body.appendChild(st);

      const chart=document.createElement('div');
      chart.className='xf-card chartWrap'; chart.id='chartWrap'; chart.style.display='none';
      chart.innerHTML='<div class="xf-eyebrow">Resultatutveckling</div><p class="chartSummary" id="chartSummary">Resultaten visas i procent över tid. Öppna tabellen för exakta datum och värden.</p><canvas id="progressChart" role="img" aria-describedby="chartSummary"></canvas><details class="chartData"><summary>Visa resultat som tabell</summary><table><caption>Provresultat i samma ordning som grafen</caption><thead><tr><th scope="col">Datum</th><th scope="col">Resultat</th></tr></thead><tbody id="chartDataRows"></tbody></table></details>';
      body.appendChild(chart);

      const wrap=document.createElement('div'); wrap.className='xf-opts'; wrap.id='examList';
      body.appendChild(wrap);

      renderExamList(d.h,'');
      $('syncBtn').addEventListener('click',async()=>{await syncFromAccount();});
      renderChart(d.h);
    }

    /* ── COACH ── analysen hämtas vid inträde. Den satt förut bakom en knapp
       med texten "Hämta P.E.R-analys" — på en skärm eleven öppnat just för att
       få den. Dygnscachen behålls: det är samma historik. */
    function renderCoach(){
      const {h,m,last}=data();
      flow.say('coach','P.E.R läser din historik.',
        'Rekommendationen bygger på dina senaste prov och din felbank.');

      const body=flow.body('coach');
      backBtn(body);

      const card=document.createElement('div');
      card.className='xf-card';
      card.innerHTML='<div class="xf-eyebrow">P.E.R · Rekommendation</div>'+
        '<div class="coachText" id="coachText"></div>';
      body.appendChild(card);

      const stats=document.createElement('dl');
      stats.className='xf-card xfStats';
      stats.innerHTML=
        '<div class="xf-row"><dt>Senaste</dt><dd id="lastText">—</dd></div>'+
        '<div class="xf-row"><dt>Trend</dt><dd id="trendText">—</dd></div>'+
        '<div class="xf-row"><dt>Fokus</dt><dd id="focusText">—</dd></div>';
      body.appendChild(stats);

      const lastA=(last&&last.attempt)?last.attempt:h[h.length-1];
      if(lastA){
        const lastPercent=chartPercent(lastA.percent);
        $('lastText').textContent=`${lastPercent===null?'Resultat saknas':`${lastPercent} %`} · ${lastA.level||'—'} · `+
          ((lastA.course||'').trim()||'Ingen kurs');
      }
      const tr=computeTrend(h);
      $('trendText').textContent=tr?`${tr.delta>=0?'+':''}${Math.round(tr.delta)} p.p.`:'—';
      const mc=mostMistakeCourse(m);
      if(mc.course){
        const topC=conceptCounts(m.filter(x=>String(x.course||'').trim()===mc.course))[0];
        $('focusText').textContent=topC?`${mc.course} › ${topC[0]} (${topC[1]})`:`${mc.course} (${mc.n})`;
      }else $('focusText').textContent='Markera 5 misstag';

      loadCoach(h,m);
    }

    async function loadCoach(h,m){
      const box=$('coachText');
      if(!box)return;
      if(!h.length){box.textContent='Ingen provdata än. Gör ett prov i appen och tryck Rätta prov.';return;}
      const cache=getCoachCache();
      if(isCoachCacheFresh(cache)){box.textContent=cache.text;return;}
      box.textContent='P.E.R läser…';
      flow.busy('coach',true);
      try{
        const text=await fetchPERCoach(h,m);
        if(text){box.textContent=text;setCoachCache({ts:Date.now(),text});}
        else coachError(box);
      }catch(_){coachError(box);}
      finally{flow.busy('coach',false);}
    }

    /* Ett misslyckat anrop säger det och går att göra om, i stället för att
       lämna ett streck som inte går att skilja från "inte hämtat än". */
    function coachError(box){
      box.textContent='Kunde inte hämta analysen just nu.';
      if($('perCoachRetry'))return;
      const b=document.createElement('button');
      b.type='button'; b.id='perCoachRetry'; b.className='xf-btn ghost'; b.textContent='Försök igen';
      b.addEventListener('click',()=>{b.remove();loadCoach(lsArr(LS_HISTORY),lsArr(LS_MISTAKES));});
      box.parentNode.appendChild(b);
    }

    /* ── ÖVNINGSRAPPORT ── */
    function renderRapport(){
      flow.say('rapport','AI-övningsrapport',
        'En AI-sammanfattning av dina rättade övningsprov. Använd som samtalsunderlag, inte som betyg eller säker kunskapsbedömning. Minst tre verifierat rättade prov krävs.');

      const body=flow.body('rapport');
      backBtn(body);

      const st=document.createElement('div');
      st.className='statusText'; st.id='reportStatus'; st.setAttribute('aria-live','polite');
      body.appendChild(st);

      const act=document.createElement('div');
      act.className='xf-act xfReportAct';
      act.innerHTML='<button class="xf-btn" id="genReportBtn" type="button">Skapa övningsrapport</button>'+
        '<button class="xf-btn ghost" id="copyReportBtn" type="button" disabled>Kopiera</button>'+
        '<span class="xf-chip" id="reportPill" style="display:none">—</span>';
      body.appendChild(act);

      const wrap=document.createElement('div');
      wrap.className='xfReportWrap';
      wrap.innerHTML=
        '<div class="loadOv" id="reportLoadingOverlay"><div class="spinner"></div>'+
        '<div class="loadSteps">'+
        '<div class="loadStep" id="loadStep1">Analyserar historik…</div>'+
        '<div class="loadStep" id="loadStep2">Identifierar mönster…</div>'+
        '<div class="loadStep" id="loadStep3">Skriver rapport…</div></div></div>'+
        '<div class="xf-card reportBox" id="reportBox">—</div>';
      body.appendChild(wrap);

      renderReportState();
      $('genReportBtn').addEventListener('click',()=>generateReport());
      $('copyReportBtn').addEventListener('click',()=>copyReport());
    }

    /* ── P.E.R ──
       Målen navigerar nu på riktigt. De skrollade tidigare till en zon, och
       två av de fem pekade på samma zon. */
    const PER_TARGETS=[
      { id:'felbank', label:'Felbank',      hint:'frågor du tappat poäng på, med modellsvar', go:function(){flow.show('felbank');} },
      { id:'prov',    label:'Prov',         hint:'alla rättade prov och resultatgrafen',      go:function(){flow.show('prov');} },
      { id:'coach',   label:'Coach',        hint:'övningsförslag från provhistorik och felbank', go:function(){flow.show('coach');} },
      { id:'rapport', label:'Övningsrapport', hint:'AI-sammanfattning från minst 3 verifierat rättade prov', go:function(){flow.show('rapport');} }
    ];

    function pushPerContext(){
      if(!window.setPerContext)return;
      const {h,m}=data();
      const areaCounts=m.slice(-30).reduce((acc,x)=>{
        const c=String(x.course||'').trim(), cn=conceptOf(x);
        const key=[c,cn].filter(Boolean).join(' › ');
        if(key)acc[key]=(acc[key]||0)+1;
        return acc;
      },{});
      const weakAreas=Object.keys(areaCounts).sort((a,b)=>areaCounts[b]-areaCounts[a]).slice(0,5);
      const recentAverage=avgPct(scoredHistory(h).slice(-5));
      window.setPerContext({
        page:'förbättring',
        userScore:recentAverage===null?undefined:recentAverage/100,
        weakAreas,
        examState:{answered:h.length,remaining:0},
        targets:PER_TARGETS
      });
      /* Exponeras bara för riggen. setPerContext sväljer manifestet och det
         finns ingen väg tillbaka ut. */
      window.__perManifestForTest={targets:PER_TARGETS};
    }
    document.addEventListener('DOMContentLoaded',pushPerContext,{once:true});

    function renderAll(){
      renderHem(); renderFelbank(); renderProv(); renderCoach(); renderRapport();
      pushPerContext();
    }

    /* Rekommendationen hämtas asynkront medan resten av sidan redan ritats.
       renderAll är synkron med flit — sidan ska inte vänta på ett nätanrop för
       att visa data som redan finns lokalt. När svaret kommer ritas hemskärmen
       om en gång, och bara om det faktiskt fanns något att visa. */
    hamtaNextFocus().then(d=>{ if(d&&d.focus) renderHem(); });

    /* Skärmen som just öppnades ska visa aktuell data — annars står coachen
       kvar på siffror från innan senaste synk. */
    flow.on(()=>renderAll());
    db?.auth?.onAuthStateChange?.((_event,session)=>{
      if(reportOwner&&session?.user?.id!==reportOwner)renderReportState();
    });

    /* ── RENSA ALL DATA ──
       Knappen kommer från window.XG_MENU_EXTRA och renderas av
       js/exgen-shell.js, som är defer — det här skriptet körs under parsningen
       och hittar den inte än. */
    document.addEventListener('DOMContentLoaded',()=>{
      const btn=$('resetBtn');
      if(!btn)return;
      btn.addEventListener('click',async()=>{
        btn.setAttribute('disabled','disabled');
        let clearSession=null;
        try{
          const{data,error}=db?await db.auth.getSession():{data:null,error:true};
          if(!error)clearSession=data?.session||null;
        }catch{}
        const clearUserId=clearSession?.user?.id||null;
        let remoteHistoryDeleted=false;
        if(db&&clearSession?.access_token){
          try{
            const r=await deleteAllUserExamsFromAccount(clearSession);
            remoteHistoryDeleted=r.ok;
            if(!r.ok)console.warn('Supabase delete failed:',r.error);
          }catch(e){console.warn('Supabase delete error:',e);}
        }
        if(clearUserId)try{localStorage.removeItem('proviaai_pending_exams:'+clearUserId);}catch{}
        const localDataOwner=localStorage.getItem('exgen_local_data_owner');
        if((clearUserId||localDataOwner)&&localDataOwner!==clearUserId){
          btn.removeAttribute('disabled');
          window.alert(!clearUserId
            ? 'Kontosessionen kunde inte verifieras. Lokal data lämnades orörd.'
            : remoteHistoryDeleted
              ? 'Kontot byttes. Serverraderingen slutfördes för det ursprungliga kontot; delad lokal data lämnades orörd.'
              : 'Kontot byttes. Kontodata kunde inte bekräftas raderad; delad lokal data lämnades orörd.');
          return;
        }
        [LS_HISTORY,LS_MISTAKES,LS_LAST,LS_MATERIAL,LS_TRAIN_PICK,LS_SMART_TIPS_CACHE,
         LS_TEACHER_REPORT_CACHE,LS_PER_COACH_CACHE,LS_CLEAR_TS].forEach(k=>localStorage.removeItem(k));
        renderAll();
        btn.removeAttribute('disabled');
        if(remoteHistoryDeleted) window.alert('Provposter och resultatsammanfattningar är rensade. P.E.R-minne och kunskapsöversikt påverkas inte.');
        else window.alert('Lokal historik rensad. Kontodata kunde inte bekräftas raderad. Försök igen när anslutningen fungerar.');
      });
    });

    /* ── INIT ── */
    (async()=>{
      renderAll();
      const ok=await gatePage();
      if(!ok) return;
      (async()=>{
        USER_NAME=getNameLocal();
        if(!USER_NAME){const n=await tryLoadName();if(n){USER_NAME=n;try{localStorage.setItem(LS_USER_NAME_A,USER_NAME);}catch{}}}
        if(db){const uid=await getUserId();if(uid)await syncFromAccount();}
        renderAll();
      })();
    })();


  </script>
